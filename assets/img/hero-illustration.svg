<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-label="Illustration som visar fem sammanlänkade tjänsteområden: digitalisering, webb och kodning, annonsering, tjänstebil och kök">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.16"/>
    </pattern>
  </defs>

  <style>
    .node { animation: floaty 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .node:nth-of-type(1) { animation-delay: 0s; }
    .node:nth-of-type(2) { animation-delay: .5s; }
    .node:nth-of-type(3) { animation-delay: 1s; }
    .node:nth-of-type(4) { animation-delay: 1.5s; }
    .node:nth-of-type(5) { animation-delay: 2s; }
    .hub { animation: pulse 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    @media (prefers-reduced-motion: reduce) {
      .node, .hub { animation: none; }
    }
  </style>

  <rect width="440" height="440" fill="url(#dots)"/>

  <g stroke="#c48a2f" stroke-width="1.5" opacity="0.45">
    <line x1="220" y1="220" x2="220" y2="60"/>
    <line x1="220" y1="220" x2="372" y2="171"/>
    <line x1="220" y1="220" x2="314" y2="349"/>
    <line x1="220" y1="220" x2="126" y2="349"/>
    <line x1="220" y1="220" x2="68" y2="171"/>
  </g>

  <g class="hub">
    <circle cx="220" cy="220" r="54" fill="#ffffff" opacity="0.08"/>
    <circle cx="220" cy="220" r="54" fill="none" stroke="#c48a2f" stroke-width="2"/>
    <text x="220" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">RG</text>
  </g>

  <!-- Digitalisering -->
  <g class="node">
    <circle cx="220" cy="60" r="30" fill="#ffffff" opacity="0.08"/>
    <circle cx="220" cy="60" r="30" fill="none" stroke="#c48a2f" stroke-width="1.5"/>
    <g transform="translate(211.4 51.4) scale(0.72)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round">
      <path d="M4 6h16M4 12h16M4 18h10"/>
    </g>
  </g>

  <!-- Webb och kodning -->
  <g class="node">
    <circle cx="372" cy="171" r="30" fill="#ffffff" opacity="0.08"/>
    <circle cx="372" cy="171" r="30" fill="none" stroke="#c48a2f" stroke-width="1.5"/>
    <g transform="translate(363.4 162.4) scale(0.72)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13 5l-2 14"/>
    </g>
  </g>

  <!-- Annonsering -->
  <g class="node">
    <circle cx="314" cy="349" r="30" fill="#ffffff" opacity="0.08"/>
    <circle cx="314" cy="349" r="30" fill="none" stroke="#c48a2f" stroke-width="1.5"/>
    <g transform="translate(305.4 340.4) scale(0.72)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11v2a2 2 0 002 2h1l3 4V5L6 9H5a2 2 0 00-2 2zM15 8a4 4 0 010 8M18 5a8 8 0 010 14"/>
    </g>
  </g>

  <!-- Tjänstebil -->
  <g class="node">
    <circle cx="126" cy="349" r="30" fill="#ffffff" opacity="0.08"/>
    <circle cx="126" cy="349" r="30" fill="none" stroke="#c48a2f" stroke-width="1.5"/>
    <g transform="translate(117.4 340.4) scale(0.72)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 16l1.5-5.5A2 2 0 017.4 9h9.2a2 2 0 011.9 1.5L20 16M4 16h16M4 16v2.5a1 1 0 001 1h1a1 1 0 001-1V16M17 16v2.5a1 1 0 001 1h1a1 1 0 001-1V16"/>
      <circle cx="7.5" cy="16" r="0.4" fill="#ffffff"/>
      <circle cx="16.5" cy="16" r="0.4" fill="#ffffff"/>
    </g>
  </g>

  <!-- Kök -->
  <g class="node">
    <circle cx="68" cy="171" r="30" fill="#ffffff" opacity="0.08"/>
    <circle cx="68" cy="171" r="30" fill="none" stroke="#c48a2f" stroke-width="1.5"/>
    <g transform="translate(59.4 162.4) scale(0.72)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9h16M6 9V6a2 2 0 012-2h8a2 2 0 012 2v3M6 9v11h12V9"/>
      <path d="M9 13v4M12 13v4M15 13v4"/>
    </g>
  </g>
</svg>
